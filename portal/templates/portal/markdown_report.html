<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18332e;background:white;line-height:1.65}body{max-width:960px;margin:0 auto;padding:32px clamp(20px,5vw,64px)}h1,h2,h3{line-height:1.25}h1{font-size:2rem}h2{margin-top:2rem}a{color:#1c5949}img{max-width:100%;height:auto}pre{overflow:auto;padding:18px;background:#f3f6f4;border-radius:8px}code{font-size:.9em;background:#f3f6f4}table{display:block;overflow:auto;border-collapse:collapse;width:100%;margin:20px 0}th,td{padding:10px 14px;border:1px solid #dce4de;text-align:left}th{background:#eef4f0}blockquote{margin-left:0;padding-left:20px;border-left:4px solid #b7d2c4;color:#52685e}hr{border:0;border-top:1px solid #dce4de;margin:28px 0}
</style></head><body><main>{{ body }}</main></body></html>
