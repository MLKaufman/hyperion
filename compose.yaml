services:
  app:
    build: .
    environment:
      DEBUG: '0'
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DUCKDB_PATH: /data/hyperion.duckdb
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:?Set PORTAL_ORIGIN}
      REPORT_ORIGIN_TEMPLATE: ${REPORT_ORIGIN_TEMPLATE:?Set REPORT_ORIGIN_TEMPLATE}
      REPORTS_ROOT: /reports
      ZIP_CACHE_ROOT: /var/cache/hyperion
      MAX_DELIVERABLE_BYTES: ${MAX_DELIVERABLE_BYTES:-268435456}
      RUN_SCANNER: '1'
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
    volumes:
      - ${REPORTS_HOST_PATH:?Set REPORTS_HOST_PATH}:/reports:ro
      - duckdb_data:/data
      - zip_cache:/var/cache/hyperion
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'uv', 'run', '--no-sync', 'python', '-c', "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/', headers={'Host': 'app', 'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    ports:
      - '80:80'
      - '443:443'
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?Set PORTAL_HOST}
      REPORT_HOST_PATTERN: ${REPORT_HOST_PATTERN:?Set REPORT_HOST_PATTERN}
    volumes:
      - ${CERTS_HOST_PATH:-./certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  duckdb_data:
  zip_cache:
  caddy_data:
  caddy_config:
