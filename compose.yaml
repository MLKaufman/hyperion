services:
  app:
    image: hyperion:local
    build: .
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${HYPERION_PORT:-8000}}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      MAX_DELIVERABLE_BYTES: ${MAX_DELIVERABLE_BYTES:-268435456}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
    ports:
      - "${HYPERION_BIND:-127.0.0.1}:${HYPERION_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${REPORTS_HOST_PATH:-./sample_reports}
        target: /reports
        read_only: true
        bind:
          create_host_path: false
      - duckdb_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  duckdb_data:
