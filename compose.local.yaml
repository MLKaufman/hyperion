# Loopback-only development deployment. Production uses compose.yaml.
services:
  app:
    build: .
    environment:
      DEBUG: '1'
      SECRET_KEY: ${SECRET_KEY:?The launcher creates .env.local with a random secret}
      DUCKDB_PATH: /data/hyperion.duckdb
      PORTAL_ORIGIN: http://portal.hyperion.localhost:${HYPERION_PORT:-8080}
      REPORT_ORIGIN_TEMPLATE: http://pi-{pi}.reports.hyperion.localhost:${HYPERION_PORT:-8080}
      REPORTS_ROOT: /reports
      ZIP_CACHE_ROOT: /var/cache/hyperion
      MAX_DELIVERABLE_BYTES: ${MAX_DELIVERABLE_BYTES:-268435456}
      RUN_SCANNER: '1'
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
    volumes:
      - type: bind
        source: ${REPORTS_HOST_PATH:-./sample_reports}
        target: /reports
        read_only: true
        bind:
          create_host_path: false
      - duckdb_data:/data
      - zip_cache:/var/cache/hyperion
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'uv', 'run', '--no-sync', 'python', '-c', "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/', headers={'Host': 'app'}), timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    ports:
      - '127.0.0.1:${HYPERION_PORT:-8080}:80'
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', '--header=Host: app', 'http://127.0.0.1/health/']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  duckdb_data:
  zip_cache:
  caddy_data:
  caddy_config:
